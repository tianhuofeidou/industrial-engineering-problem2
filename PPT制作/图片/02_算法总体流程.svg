<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="65" y="67" font-size="36" fill="#16324f" text-anchor="start" font-weight="700">正式算法总体流程</text><text x="65" y="111" font-size="23" fill="#66717e" text-anchor="start">从原始数据独立运行，最终输出完整调度与验证结果</text><rect x="65" y="240" width="325" height="240" fill="white" stroke="#2369a8" stroke-width="2"/><text x="85" y="290" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">多次构造与局部下降</text><text x="85" y="349" font-size="21" fill="#16324f" text-anchor="start">8次构造，五种邻域完整下降</text><text x="85" y="405" font-size="21" fill="#16324f" text-anchor="start">保留最好完整编码</text><line x1="395" y1="360" x2="440" y2="360" stroke="#2369a8" stroke-width="3"/><polygon points="440,360 427.39374056706254,366.08951747755725 427.39374056706254,353.91048252244275" fill="#2369a8"/><rect x="450" y="240" width="325" height="240" fill="white" stroke="#2369a8" stroke-width="2"/><text x="470" y="290" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">模拟退火</text><text x="470" y="349" font-size="21" fill="#16324f" text-anchor="start">随机移动与概率接受</text><text x="470" y="405" font-size="21" fill="#16324f" text-anchor="start">保留搜索中最好编码</text><line x1="780" y1="360" x2="825" y2="360" stroke="#2369a8" stroke-width="3"/><polygon points="825,360 812.3937405670625,366.08951747755725 812.3937405670625,353.91048252244275" fill="#2369a8"/><rect x="835" y="240" width="325" height="240" fill="white" stroke="#2369a8" stroke-width="2"/><text x="855" y="290" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">Gurobi区间搜索</text><text x="855" y="349" font-size="21" fill="#16324f" text-anchor="start">A、B各放开一个连续区间</text><text x="855" y="405" font-size="21" fill="#16324f" text-anchor="start">严格改善才更新参考解</text><line x1="1165" y1="360" x2="1210" y2="360" stroke="#2369a8" stroke-width="3"/><polygon points="1210,360 1197.3937405670624,366.08951747755725 1197.3937405670624,353.91048252244275" fill="#2369a8"/><rect x="1220" y="240" width="325" height="240" fill="white" stroke="#2369a8" stroke-width="2"/><text x="1240" y="290" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">完整核验与导出</text><text x="1240" y="349" font-size="21" fill="#16324f" text-anchor="start">核查全部工序和工位6完工顺序</text><text x="1240" y="405" font-size="21" fill="#16324f" text-anchor="start">输出目标、甘特图与工序表</text><line x1="1015" y1="485" x2="1015" y2="564" stroke="#2369a8" stroke-width="3"/><line x1="1015" y1="564" x2="925" y2="564" stroke="#2369a8" stroke-width="3"/><line x1="925" y1="564" x2="925" y2="485" stroke="#2369a8" stroke-width="3"/><polygon points="925,485 931.0895174775573,497.60625943293746 918.9104825224427,497.60625943293746" fill="#2369a8"/><text x="740" y="618" font-size="25" fill="#2369a8" text-anchor="start">区间未结束时继续选择范围</text><text x="65" y="710" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">预算上限：总600秒，退火90秒，精确阶段110秒／80轮</text><text x="65" y="766" font-size="26" fill="#16324f" text-anchor="start">实际运行可提前结束；区间初始宽5，每轮最多5秒，8线程</text><text x="65" y="836" font-size="23" fill="#66717e" text-anchor="start">stage2保留为未来研究，未接入本页正式流程</text></g></svg>