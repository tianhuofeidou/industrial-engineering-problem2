<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="65" y="67" font-size="36" fill="#16324f" text-anchor="start" font-weight="700">模拟退火的移动与接受</text><text x="65" y="111" font-size="23" fill="#66717e" text-anchor="start">当前编码与搜索中最好编码分别保存</text><text x="65" y="222" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">当前A</text><rect x="400" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="468.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J1</text><rect x="545" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="613.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J2</text><rect x="690" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="758.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J3</text><rect x="835" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="903.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J4</text><rect x="980" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1048.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J5</text><rect x="1125" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1193.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J6</text><rect x="1270" y="180" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1338.5" y="221" font-size="27" fill="#16324f" text-anchor="middle">J7</text><text x="65" y="327" font-size="27" fill="#16324f" text-anchor="start" font-weight="700">插入后的A</text><rect x="400" y="285" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="468.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J1</text><rect x="545" y="285" width="137" height="62" fill="#dcedf9" stroke="#2369a8" stroke-width="2"/><text x="613.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J4</text><rect x="690" y="285" width="137" height="62" fill="#dcedf9" stroke="#2369a8" stroke-width="2"/><text x="758.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J2</text><rect x="835" y="285" width="137" height="62" fill="#dcedf9" stroke="#2369a8" stroke-width="2"/><text x="903.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J3</text><rect x="980" y="285" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1048.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J5</text><rect x="1125" y="285" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1193.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J6</text><rect x="1270" y="285" width="137" height="62" fill="#f1f3f5" stroke="#b8c1cb" stroke-width="2"/><text x="1338.5" y="326" font-size="27" fill="#16324f" text-anchor="middle">J7</text><text x="65" y="440" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">五种移动</text><text x="380" y="440" font-size="28" fill="#16324f" text-anchor="start">A插入、B插入、单工件换机、A交换、B交换</text><text x="65" y="525" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">完整评分</text><text x="380" y="525" font-size="28" fill="#16324f" text-anchor="start">Δ = 候选最终完成时间 − 当前最终完成时间</text><text x="65" y="610" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">接受规则</text><text x="380" y="610" font-size="28" fill="#16324f" text-anchor="start">Δ ≤ 0直接接受；Δ &gt; 0以 exp(−Δ / T) 概率接受</text><text x="65" y="695" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">温度更新</text><text x="380" y="695" font-size="28" fill="#16324f" text-anchor="start">每层1000次移动后 T ← 0.97T</text><text x="65" y="792" font-size="27" fill="#087f8c" text-anchor="start">较差候选可暂时成为当前解，输出始终保留已找到的最好解</text></g></svg>