ext x="1338.5" y="606" font-size="27" fill="#16324f" text-anchor="middle">J7</text><text x="65" y="716" font-size="25" fill="#16324f" text-anchor="start">A内只重排J3、J4、J5；B内只重排J4、J3、J6，工件不能移出各自区间</text><text x="65" y="765" font-size="25" fill="#16324f" text-anchor="start">两个区间工件的并集J3、J4、J5、J6可换机；其他工件机器归属固定</text><text x="65" y="833" font-size="23" fill="#66717e" text-anchor="start">时间仍允许等待，全部工序保留；本轮受限最优不能证明原题全局最优</text></g></svg>