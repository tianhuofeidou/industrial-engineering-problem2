<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16324f"><text x="65" y="67" font-size="36" fill="#16324f" text-anchor="start" font-weight="700">是否保留前置模拟退火</text><text x="65" y="111" font-size="23" fill="#66717e" text-anchor="start">三个种子，同初始化起点；退火计入180秒追加预算，区间固定宽5</text><text x="260" y="210" font-size="30" fill="#16324f" text-anchor="middle" font-weight="700">种子23</text><text x="260" y="310" font-size="25" fill="#66717e" text-anchor="middle">直接区间</text><text x="260" y="370" font-size="45" fill="#2369a8" text-anchor="middle" font-weight="700">10922</text><text x="260" y="455" font-size="25" fill="#66717e" text-anchor="middle">退火后区间</text><text x="260" y="515" font-size="45" fill="#087f8c" text-anchor="middle" font-weight="700">10861</text><text x="260" y="655" font-size="30" fill="#087f8c" text-anchor="middle">退火组更好</text><text x="750" y="210" font-size="30" fill="#16324f" text-anchor="middle" font-weight="700">种子53</text><text x="750" y="310" font-size="25" fill="#66717e" text-anchor="middle">直接区间</text><text x="750" y="370" font-size="45" fill="#2369a8" text-anchor="middle" font-weight="700">10917</text><text x="750" y="455" font-size="25" fill="#66717e" text-anchor="middle">退火后区间</text><text x="750" y="515" font-size="45" fill="#087f8c" text-anchor="middle" font-weight="700">11026</text><text x="750" y="655" font-size="30" fill="#bd5a14" text-anchor="middle">退火组更差</text><text x="1240" y="210" font-size="30" fill="#16324f" text-anchor="middle" font-weight="700">种子71</text><text x="1240" y="310" font-size="25" fill="#66717e" text-anchor="middle">直接区间</text><text x="1240" y="370" font-size="45" fill="#2369a8" text-anchor="middle" font-weight="700">10917</text><text x="1240" y="455" font-size="25" fill="#66717e" text-anchor="middle">退火后区间</text><text x="1240" y="515" font-size="45" fill="#087f8c" text-anchor="middle" font-weight="700">10917</text><text x="1240" y="655" font-size="30" fill="#66717e" text-anchor="middle">退火组同值</text><text x="65" y="772" font-size="30" fill="#16324f" text-anchor="start" font-weight="700">退火有利、直接求解有利、最终同值各一组</text><text x="65" y="835" font-size="24" fill="#66717e" text-anchor="start">保留退火是当前选择；三组结果不能证明退火必需，也不能证明可以普遍删除</text></g></svg>